[package]
name = "tycode-core"
version = "0.1.0"
edition = "2021"
authors = ["Aurora DSQL Deco Team"]
description = "Core chat actor and AI functionality for TyCode"

[features]
default = []
desktop = ["tokio/fs", "regex", "walkdir"]

[dependencies]
# Core dependencies that work in WASM
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
similar = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

# Tokio with minimal features for WASM compatibility
tokio = { version = "1.36.0", default-features = false, features = ["macros", "sync", "time"] }

# UUID with WASM support
uuid = { version = "1.6.1", features = ["v4", "serde", "js"] }

# For WASM random number generation
getrandom = { version = "0.2", features = ["js"] }

# Platform-specific file operations (desktop feature)
regex = { version = "1.10", optional = true }
walkdir = { version = "2.4", optional = true }

# AWS SDK with minimal features
aws-config = { version = "1.1.1", default-features = false }
aws-sdk-bedrockruntime = { version = "1.4.0", default-features = false }
aws-smithy-types = { version = "1", default-features = false, features = ["serde-deserialize", "serde-serialize"] }
aws-smithy-async = { version = "1", default-features = false }
aws-smithy-runtime-api = { version = "1", default-features = false }
aws-smithy-http = { version = "0.60", default-features = false }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestMode", "Response", "Headers", "console"] }
js-sys = "0.3"
wasm-timer = "0.2"

# Native-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { version = "1.1.1" }
aws-sdk-bedrockruntime = { version = "1.4.0" }

[dev-dependencies]
tempfile = "3.8"
